<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1230">
<title>Жижигхэн гэрэл — санал өгөх</title>
<style>
@font-face{font-family:Fira;src:url('fonts/FiraSans-Medium.ttf');}
@font-face{font-family:FiraB;src:url('fonts/FiraSans-Bold.ttf');}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Fira,sans-serif;color:#fff8ec;background:radial-gradient(circle at 50% 0%,#24305f,#0b1230 70%)}
.wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:22px 20px 28px;max-width:520px;margin:0 auto}
header{text-align:center;font:20px FiraB;letter-spacing:2px;color:#ffcf73;padding:6px 0 18px}
header span{display:block;font:14px Fira;letter-spacing:0;color:#fff8ec;opacity:.6;margin-top:4px}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.lamp{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#fff4c4 0%,#ffcf73 35%,rgba(255,207,115,0) 70%);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.15);opacity:.7}}
.big{font:28px FiraB;line-height:1.3}
.small{font-size:17px;opacity:.7;line-height:1.4}
.q{font:30px FiraB;line-height:1.25;text-align:center;margin:8px 0 22px}
.btn{flex:1;min-height:150px;border:0;border-radius:26px;margin:8px 0;padding:18px 20px;display:flex;align-items:center;gap:18px;font:24px FiraB;color:#141414;text-align:left;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn .k{flex:none;width:62px;height:62px;border-radius:16px;background:rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font:36px FiraB}
#bA{background:#8ec0ff}#bB{background:#ffc979}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:14px}
.bar div{height:100%;background:#ffcf73;transform-origin:left}
.check{width:96px;height:96px;border-radius:50%;background:#3fb36b;display:flex;align-items:center;justify-content:center;font:56px FiraB;color:#fff}
.pick{padding:10px 18px;border-radius:14px;font:20px FiraB;color:#141414}
.off{opacity:.6;text-align:center;font-size:15px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>ЖИЖИГХЭН ГЭРЭЛ<span>Түүхийг та шийднэ</span></header>
  <div class="screen on" id="sWait">
    <div class="center">
      <div class="lamp"></div>
      <div class="big">Та холбогдлоо!</div>
      <div class="small" id="waitTxt">Том дэлгэц рүү хараарай.<br>Асуулт гарахад энд товч гарч ирнэ.</div>
    </div>
  </div>
  <div class="screen" id="sVote">
    <div class="q" id="q"></div>
    <button class="btn" id="bA"><span class="k">А</span><span id="tA"></span></button>
    <button class="btn" id="bB"><span class="k">Б</span><span id="tB"></span></button>
    <div class="bar"><div id="tb"></div></div>
  </div>
  <div class="screen" id="sDone">
    <div class="center">
      <div class="check">✓</div>
      <div class="big">Таны санал бүртгэгдлээ</div>
      <div class="pick" id="myPick"></div>
      <div class="small">Том дэлгэц рүү хараарай. Ихэнх хүний сонгосноор түүх үргэлжилнэ.</div>
    </div>
  </div>
  <div class="off" id="conn"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
let vid = null; try { vid = localStorage.getItem('jg_vid'); } catch (e) {}
if (!vid) { vid = Math.random().toString(36).slice(2) + Date.now().toString(36); try { localStorage.setItem('jg_vid', vid); } catch (e) {} }
const socket = io();
let poll = null, mine = {};
function screen(id) { ['sWait', 'sVote', 'sDone'].forEach(s => $(s).classList.toggle('on', s === id)); }
function render() {
  if (!poll || !poll.open) {
    screen('sWait');
    $('waitTxt').innerHTML = poll && !poll.open ? 'Санал авч дууслаа.<br>Түүх үргэлжилж байна, том дэлгэц рүү хараарай.' : 'Том дэлгэц рүү хараарай.<br>Асуулт гарахад энд товч гарч ирнэ.';
    return;
  }
  if (mine[poll.id]) { screen('sDone'); const c = mine[poll.id]; $('myPick').textContent = (c === 'A' ? 'А · ' + poll.a : 'Б · ' + poll.b); $('myPick').style.background = c === 'A' ? '#8ec0ff' : '#ffc979'; return; }
  $('q').textContent = poll.q; $('tA').textContent = poll.a; $('tB').textContent = poll.b; screen('sVote');
}
function send(choice) {
  if (!poll || !poll.open) return;
  if (navigator.vibrate) navigator.vibrate(30);
  mine[poll.id] = choice; render();
  socket.emit('vote', { pollId: poll.id, choice, voterId: vid });
}
$('bA').onclick = () => send('A'); $('bB').onclick = () => send('B');
socket.on('connect', () => { socket.emit('hello', 'voter'); $('conn').textContent = ''; });
socket.on('disconnect', () => { $('conn').textContent = 'Холболт тасарлаа, дахин холбогдож байна…'; });
socket.on('poll', p => { poll = p; if (p) p.localEnd = Date.now() + p.left; render(); });
socket.on('voted', d => { mine[d.pollId] = d.choice; render(); });
setInterval(() => { if (poll && poll.open) { const left = Math.max(0, poll.localEnd - Date.now()); $('tb').style.transform = `scaleX(${left / 20000})`; } }, 200);
</script>
</body>
</html>
